services:

  # ─────────────────────────────────────────────────────────────────────
  # CONTENEDOR 1: Emulador AWS (LocalStack o MiniStack)
  # Cambia solo la línea "image:" para elegir entre los dos.
  # Ambos exponen el mismo endpoint en el puerto 4566.
  # ─────────────────────────────────────────────────────────────────────
  emulador:
    # Opción A — LocalStack (más completo, recomendado):
    # Fijado a 4.14: las versiones posteriores ("latest", 2026.x) exigen
    # LOCALSTACK_AUTH_TOKEN y sin él el contenedor sale con código 55.
    image: localstack/localstack:4.14
    # Opción B — MiniStack (más ligero):
    # image: ministack/ministack

    container_name: emulador
    ports:
      - "4566:4566"
    environment:
      # cloudformation, iam, s3, ssm, sts y logs los necesita `cdklocal bootstrap/deploy`
      SERVICES: "apigateway,lambda,dynamodb,cloudformation,iam,s3,ssm,sts,logs"
      DEBUG: "1"
      DOCKER_HOST: unix:///var/run/docker.sock
      # Necesario para que las Lambdas resuelvan redis dentro de la red
      # Docker Compose crea una automáticamente la red <nombre-del-proyecto>_default
      # y conecta a ella todos los servicios del compose.
      LAMBDA_DOCKER_NETWORK: bdnr-final-local
      # Segundos que LocalStack espera a que arranque el contenedor de una
      # Lambda (por defecto 20). Con varias Lambdas arrancando en frío a la
      # vez (la tienda pide carrito, promoción, catálogo... al cargar) y cada
      # una copiando sus dependencias, 20 s no alcanzan en Docker Desktop.
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./emulador-data:/var/lib/localstack
    networks:
      default:
        # El CDK sube los assets a S3 con estilo virtual-host (<bucket>.<host>).
        # Estos alias hacen que esos nombres apunten al emulador dentro de la red.
        # El bucket de bootstrap siempre es cdk-hnb659fds-assets-<cuenta>-<región>.
        aliases:
          - s3.localhost.localstack.cloud
          - cdk-hnb659fds-assets-000000000000-us-east-1.s3.localhost.localstack.cloud
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────
  # CONTENEDOR 2: Redis (caché in-memory)
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────
  # CONTENEDOR 2b: Elasticsearch (búsqueda libre de productos, patrón #6)
  # Solo guarda un espejo de los campos de texto; la fuente de verdad sigue
  # siendo DynamoDB. Misma versión que el cliente (elasticsearch==8.11.0).
  # Las Lambdas lo alcanzan como "elasticsearch:9200" por la red compartida.
  # ─────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    # Nombre propio: "elasticsearch" choca con contenedores de otros proyectos.
    # Las Lambdas lo resuelven igual como "elasticsearch" (nombre del servicio).
    container_name: bdnr-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      # Laboratorio local: sin TLS ni usuario (el cliente usa http://)
      xpack.security.enabled: "false"
      # Limita la memoria de la JVM (por defecto toma la mitad del equipo)
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # CONTENEDOR 2c: Frontend de la demo (http://localhost:8080)
  # nginx sirve frontend/ y hace de proxy al emulador (mismo origen, sin
  # CORS). El frontend descubre solo el api-id vigente después de cada deploy.
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    container_name: bdnr-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      emulador:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────
  # CONTENEDOR 3: Entorno de desarrollo CDK
  # Aquí se trabaja: se escribe la infra y el código de las Lambdas.
  # ─────────────────────────────────────────────────────────────────────
  cdk-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdk-dev
    volumes:
      - ./app:/app
    working_dir: /app
    depends_on:
      emulador:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Redirige todas las llamadas boto3 al emulador local
      AWS_ENDPOINT_URL: http://emulador:4566
      # cdklocal exige un endpoint de S3 explícito si AWS_ENDPOINT_URL está definido.
      # Usa el dominio de LocalStack para que los buckets se resuelvan como
      # subdominios (ver los aliases de red del servicio emulador).
      AWS_ENDPOINT_URL_S3: http://s3.localhost.localstack.cloud:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # Conexión a Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    # Se mantiene vivo para que puedas entrar con `docker compose exec cdk-dev bash`
    stdin_open: true
    tty: true
    command: bash

volumes:
  redis_data:
  es_data:

networks:
  default:
    name: bdnr-final-local