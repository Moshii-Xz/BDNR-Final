# ─────────────────────────────────────────────────────────────────────
# nginx del frontend
#  - Sirve los archivos estáticos de frontend/.
#  - Hace de proxy hacia el emulador para que el navegador hable con el
#    API desde el MISMO origen (localhost:8080): así no hace falta CORS
#    (las rutas del API Gateway no tienen métodos OPTIONS y el header
#    X-Username obligaría a un preflight).
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver de Docker: el nombre "emulador" se resuelve en cada petición,
    # así nginx arranca aunque el emulador todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $emulador http://emulador:4566;

    # LocalStack valida CORS por su cuenta y responde 403 a los Origin/Referer
    # que no conoce (ej. http://localhost:8080). Para el navegador todo es del
    # mismo origen (este nginx), así que no se reenvían al emulador. Va en
    # cada location porque proxy_set_header no se hereda si la location
    # define el suyo.

    # Descubrir el api-id (cambia en cada `cdklocal deploy`).
    # LocalStack enruta por el servicio que nombra la firma: sin un header
    # Authorization de "apigateway" trataría /restapis como un bucket S3.
    # Las credenciales son las de prueba del emulador ("test").
    location = /apis-desplegadas {
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Authorization "AWS4-HMAC-SHA256 Credential=test/20260101/us-east-1/apigateway/aws4_request, SignedHeaders=host, Signature=0";
        proxy_pass $emulador/restapis;
    }

    # Llamadas al API: /restapis/<id>/prod/_user_request_/<ruta>
    location /restapis/ {
        proxy_pass $emulador;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 60s;   # la primera llamada a cada Lambda (arranque en frío) tarda
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin caché del navegador para el código: en la demo se edita y recarga
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }
}
